<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#1a1a1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-x:hidden}
  body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,24px) 24px env(safe-area-inset-bottom,32px);min-height:100vh}

  .tint{position:fixed;inset:0;z-index:0;transition:background 0.6s ease;pointer-events:none}
  .inner{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}

  /* CONFIG */
  .config{width:100%;margin-bottom:32px;margin-top:8px}
  .cfg-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #2a2a2a}
  .cfg-row:last-child{border-bottom:none}
  .cfg-label{font-size:13px;color:#777;min-width:100px;flex-shrink:0}
  .cfg-val{font-size:14px;font-weight:500;min-width:28px;text-align:right;flex-shrink:0}
  .step-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid #3a3a3a;background:transparent;color:#ccc;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s,transform 0.1s}
  .step-btn:active{transform:scale(0.9);background:#2a2a2a}
  input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;background:#333;border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;background:#fff;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.5)}

  /* FACE */
  .face{width:100%;text-align:center;padding:8px 0 20px}
  .phase-label{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#666;margin-bottom:12px;min-height:16px;transition:color 0.4s}
  .time-display{font-size:96px;font-weight:300;letter-spacing:-5px;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:12px;transition:color 0.4s}
  .sub-text{font-size:14px;color:#666;margin-bottom:24px;min-height:20px;transition:color 0.4s}
  .progress-wrap{width:100%;height:2px;background:#2a2a2a;border-radius:1px;margin-bottom:20px}
  .progress-bar{height:2px;border-radius:1px;background:#fff;transition:width 0.9s linear,background 0.5s}
  .dot-row{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:20px;min-height:8px}
  .dot{width:6px;height:6px;border-radius:50%;background:#2a2a2a;transition:background 0.3s,transform 0.2s}
  .dot.done{background:#484848}
  .dot.current{background:#fff;transform:scale(1.4)}
  .next-label{font-size:12px;color:#555;min-height:16px}

  /* NAV ARROWS */
  .nav-row{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
  .nav-btn{width:52px;height:52px;border-radius:50%;border:1.5px solid #2e2e2e;background:transparent;color:#888;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,transform 0.1s}
  .nav-btn:active{transform:scale(0.93);background:#2a2a2a}

  /* MAIN CONTROLS */
  .controls{display:flex;gap:10px;width:100%;margin-bottom:24px}
  .btn{flex:1;border:1.5px solid #2e2e2e;background:transparent;color:#fff;border-radius:12px;padding:15px 0;font-size:16px;font-weight:500;cursor:pointer;font-family:inherit;transition:background 0.15s,transform 0.1s}
  .btn:active{transform:scale(0.97);background:#2a2a2a}
  .btn-main{background:#fff;color:#1a1a1a;border-color:#fff}
  .btn-main:active{background:#e0e0e0}

  /* FINISH MESSAGE */
  .finish-msg{text-align:center;margin-bottom:28px;display:none}
  .finish-title{font-size:28px;font-weight:300;letter-spacing:-0.5px;margin-bottom:6px}
  .finish-sub{font-size:14px;color:#666}

  /* SUMMARY */
  .summary{width:100%;display:none}
  .sum-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{background:#222;border-radius:12px;padding:16px 8px;text-align:center}
  .stat-val{font-size:22px;font-weight:300}
  .stat-lbl{font-size:11px;color:#555;margin-top:5px;letter-spacing:0.3px}
</style>
</head>
<body>

<div class="tint" id="tint"></div>
<div class="inner">

  <div class="config" id="configPanel">
    <div class="cfg-row">
      <span class="cfg-label">Intervalos</span>
      <button class="step-btn" onclick="step('sRounds',-1)">−</button>
      <input type="range" id="sRounds" min="2" max="20" value="8" step="1">
      <button class="step-btn" onclick="step('sRounds',1)">+</button>
      <span class="cfg-val" id="vRounds">8</span>
    </div>
    <div class="cfg-row">
      <span class="cfg-label">Trabajo (seg)</span>
      <button class="step-btn" onclick="step('sWork',-1)">−</button>
      <input type="range" id="sWork" min="10" max="360" value="40" step="5">
      <button class="step-btn" onclick="step('sWork',1)">+</button>
      <span class="cfg-val" id="vWork">40</span>
    </div>
    <div class="cfg-row">
      <span class="cfg-label">Descanso (seg)</span>
      <button class="step-btn" onclick="step('sRest',-1)">−</button>
      <input type="range" id="sRest" min="10" max="360" value="20" step="5">
      <button class="step-btn" onclick="step('sRest',1)">+</button>
      <span class="cfg-val" id="vRest">20</span>
    </div>
    <div class="cfg-row">
      <span class="cfg-label">Preparación (seg)</span>
      <button class="step-btn" onclick="step('sPrep',-1)">−</button>
      <input type="range" id="sPrep" min="10" max="360" value="10" step="5">
      <button class="step-btn" onclick="step('sPrep',1)">+</button>
      <span class="cfg-val" id="vPrep">5</span>
    </div>
  </div>

  <div class="face" id="face">
    <div class="phase-label" id="phaseLabel"></div>
    <div class="time-display" id="timeBig">—</div>
    <div class="sub-text" id="subText">Empieza cuando estés listo</div>
    <div class="progress-wrap"><div class="progress-bar" id="progBar" style="width:100%"></div></div>
    <div class="dot-row" id="dotRow"></div>
    <div class="next-label" id="nextLabel"></div>
  </div>

  <div class="nav-row" id="navRow" style="display:none">
    <button class="nav-btn" onclick="skipPhase(-1)" title="Anterior">&#8592;</button>
    <button class="nav-btn" onclick="skipPhase(1)" title="Siguiente">&#8594;</button>
  </div>

  <div class="controls">
    <button class="btn btn-main" id="btnStart" onclick="startTimer()">Iniciar</button>
    <button class="btn" id="btnReset" onclick="resetTimer()" style="display:none">Reset</button>
  </div>

  <div class="finish-msg" id="finishMsg">
    <div class="finish-title">Bien hecho, titán.</div>
    <div class="finish-sub">Sesión completada</div>
  </div>

  <div class="summary" id="summary">
    <div class="sum-grid">
      <div class="stat"><div class="stat-val" id="sDone">—</div><div class="stat-lbl">Intervalos</div></div>
      <div class="stat"><div class="stat-val" id="sTime">—</div><div class="stat-lbl">Duración</div></div>
      <div class="stat"><div class="stat-val" id="sKcal">—</div><div class="stat-lbl">kcal aprox.</div></div>
    </div>
  </div>

</div>

<script>
const AC = new (window.AudioContext || window.webkitAudioContext)();

function tone(freq, dur, vol=0.2, type='sine'){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.connect(g); g.connect(AC.destination);
  o.frequency.value=freq; g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur+0.05);
}

function playWork(){
  tone(220,0.08,0.3,'sawtooth');
  setTimeout(()=>tone(330,0.08,0.3,'sawtooth'),80);
  setTimeout(()=>tone(440,0.12,0.35,'sawtooth'),160);
}

function playRest(){
  tone(660,0.15,0.2,'sine');
  setTimeout(()=>tone(550,0.15,0.2,'sine'),140);
  setTimeout(()=>tone(440,0.2,0.18,'sine'),280);
}

function playDone(){
  [330,415,495,660].forEach((f,i)=>setTimeout(()=>tone(f,0.25,0.28,'sine'),i*130));
}

function playTick(){ tone(1100,0.04,0.1,'sine') }

// sliders
['sRounds','sWork','sRest','sPrep'].forEach(id=>{
  const vid='v'+id[1].toUpperCase()+id.slice(2);
  document.getElementById(id).oninput=function(){
    document.getElementById(vid).textContent=this.value;
    if(!running) renderDots(cfg().rounds,0,-1);
  };
});

function step(id,dir){
  const el=document.getElementById(id);
  const stepVal=+el.step||1, min=+el.min, max=+el.max;
  let val=+el.value + dir*stepVal;
  val=Math.max(min,Math.min(max,val));
  el.value=val;
  el.dispatchEvent(new Event('input'));
}

function cfg(){return{rounds:+sRounds.value,work:+sWork.value,rest:+sRest.value,prep:+sPrep.value}}
function fmt(s){return(s<10?'0':'')+s}
function fmtMin(s){const m=Math.floor(s/60),ss=s%60;return m>0?m+'m '+ss+'s':ss+'s'}

function renderDots(rounds,done,current){
  const row=document.getElementById('dotRow'); row.innerHTML='';
  for(let i=0;i<rounds;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<done?' done':i===current?' current':'');
    row.appendChild(d);
  }
}

function setTint(ph){
  const t=document.getElementById('tint');
  if(ph==='work') t.style.background='rgba(180,60,30,0.18)';
  else if(ph==='rest') t.style.background='rgba(30,120,100,0.16)';
  else if(ph==='prep') t.style.background='rgba(80,80,160,0.13)';
  else t.style.background='transparent';
}

let ticker=null,phase='idle',curRound=0,timeLeft=0,phaseDur=0,totalElapsed=0,running=false,savedCfg=null;

function startTimer(){
  if(AC.state==='suspended') AC.resume();
  savedCfg=cfg();
  running=true;
  configPanel.style.opacity='0.25';
  configPanel.style.pointerEvents='none';
  btnStart.style.display='none';
  btnReset.style.display='';
  navRow.style.display='flex';
  summary.style.display='none';
  finishMsg.style.display='none';
  totalElapsed=0; curRound=0;
  startPhase('prep');
}

function startPhase(ph){
  phase=ph; const c=savedCfg;
  setTint(ph);
  if(ph==='prep'){
    phaseLabel.textContent='Preparación';
    subText.textContent='Empieza cuando estés listo';
    nextLabel.textContent='A continuación: Ronda 1 — Intenso';
    progBar.style.background='#555';
    phaseDur=timeLeft=c.prep;
    renderDots(c.rounds,0,-1);
  } else if(ph==='work'){
    phaseLabel.textContent='Intenso';
    subText.textContent='Ronda '+(curRound+1)+' de '+c.rounds;
    nextLabel.textContent=curRound+1<c.rounds?'A continuación: Descanso activo':'Último intervalo';
    progBar.style.background='#e8724a';
    phaseDur=timeLeft=c.work;
    renderDots(c.rounds,curRound,curRound);
    playWork();
  } else if(ph==='rest'){
    phaseLabel.textContent='Descanso activo';
    subText.textContent='Ronda '+(curRound+1)+' de '+c.rounds;
    nextLabel.textContent=curRound+1<c.rounds?'A continuación: Ronda '+(curRound+2)+' — Intenso':'Último descanso';
    progBar.style.background='#5aafa0';
    phaseDur=timeLeft=c.rest;
    renderDots(c.rounds,curRound,curRound);
    playRest();
  } else if(ph==='done'){
    clearInterval(ticker);
    phaseLabel.textContent='';
    timeBig.textContent='—';
    subText.textContent='';
    nextLabel.textContent='';
    progBar.style.width='100%';
    renderDots(c.rounds,c.rounds,-1);
    setTint('done');
    playDone();
    navRow.style.display='none';
    finishMsg.style.display='block';
    showSummary(c);
    return;
  }
  tick();
}

function tick(){
  clearInterval(ticker);
  render();
  ticker=setInterval(()=>{
    totalElapsed++; timeLeft--;
    if(timeLeft>0&&timeLeft<=3) playTick();
    if(timeLeft<=0){clearInterval(ticker);advance();}
    else render();
  },1000);
}

function render(){
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  timeBig.textContent=m>0?m+':'+fmt(s):fmt(s);
  progBar.style.width=(timeLeft/phaseDur*100)+'%';
}

function advance(){
  if(phase==='prep'){curRound=0;startPhase('work');}
  else if(phase==='work'){startPhase('rest');}
  else if(phase==='rest'){curRound++;curRound>=savedCfg.rounds?startPhase('done'):startPhase('work');}
}

function skipPhase(dir){
  if(!running||phase==='done') return;
  clearInterval(ticker);
  const c=savedCfg;
  if(dir===1){
    if(phase==='prep'){curRound=0;startPhase('work');}
    else if(phase==='work'){startPhase('rest');}
    else if(phase==='rest'){curRound++;curRound>=c.rounds?startPhase('done'):startPhase('work');}
  } else {
    if(phase==='prep'){startPhase('prep');}
    else if(phase==='work'){
      if(curRound===0) startPhase('prep');
      else{curRound--;startPhase('rest');}
    } else if(phase==='rest'){
      startPhase('work');
    }
  }
}

function resetTimer(){
  clearInterval(ticker); running=false;
  phase='idle'; curRound=0; timeLeft=0;
  phaseLabel.textContent=''; timeBig.textContent='—';
  subText.textContent='Empieza cuando estés listo';
  nextLabel.textContent='';
  progBar.style.width='100%'; progBar.style.background='#fff';
  setTint('idle');
  configPanel.style.opacity='1'; configPanel.style.pointerEvents='';
  btnStart.style.display=''; btnReset.style.display='none';
  navRow.style.display='none';
  summary.style.display='none'; finishMsg.style.display='none';
  renderDots(cfg().rounds,0,-1);
}

function showSummary(c){
  summary.style.display='';
  sDone.textContent=c.rounds;
  sTime.textContent=fmtMin(totalElapsed);
  sKcal.textContent='~'+Math.round(totalElapsed/60*8);
}

renderDots(cfg().rounds,0,-1);
</script>
</body>
</html>
